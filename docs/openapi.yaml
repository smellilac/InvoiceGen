openapi: 3.0.3
info:
  title: Invoice App API
  version: "0.14.0"
  description: |
    Original API specification for a new invoicing web app. It is INSPIRED BY
    invoice-generator.com (same idea: fill a form, pick a document type, get a
    professional PDF) but is a separate, independent product with its own
    backend, its own data model, and its own UI — nothing here calls or depends
    on invoice-generator.com.

    Scope of this version (Phase 1, as agreed with the product owner):
      1. User accounts with full login (JWT), not bare API keys.
      2. A "document types" listing so the main page can show the user a choice
         of what to generate (invoice, receipt, quote, ...).
      3. Creating and downloading documents (PDF) by filling out a form.
      4. Because documents belong to a logged-in user, they are also listed here
         as a lightweight "history" (list/get/delete) — this falls out naturally
         from having accounts, even though it wasn't explicitly requested.

    Explicitly OUT of scope for this version (left for a later phase — see the
    x-future-phases block at the bottom of this file): payment collection/
    webhooks. (Customers, as of 0.3.0, and emailing documents to customers, as
    of 0.8.0, are no longer deferred — see below.)

    Changelog:
      0.2.0 — Resolved three open design questions from the spec review:
        - Money fields now use the reusable `MonetaryAmount` schema and are
          documented as decimal, not float/double (target stack: .NET Core —
          map to C#'s `decimal`, never `double`; verified with a real .NET 8
          program that `0.1m + 0.2m == 0.3m` exactly, while the `double`
          equivalent does not). See `x-rounding-policy` below for the full
          rationale, including a worked example.
        - `number` (the document/invoice number) is confirmed as a fully
          optional, free-text field that the API never generates, validates
          for uniqueness, or mutates — the user (or the frontend, as a
          suggestion) is responsible for it. See its field description.
        - Documented the chosen tax-rounding policy (per line item, then
          summed) explicitly, since it's a real business decision, not a
          technical default.
      0.3.0 — Added the Customers resource (was previously deferred).
        Payments/webhooks and Email delivery remain explicitly out of scope
        for this round — Payments in particular was scoped down to "not
        needed yet" rather than designed, since there's no near-term need
        to collect money through this system. See `x-customer-policy` for
        the one real design decision this introduced: documents snapshot a
        customer's info at creation time rather than staying live-linked.
      0.4.0 — Closed three gaps found while fixing the Packing Slip
        money-hiding bug and the PDF title bug:
        - Documented discount-before-tax ordering in `x-rounding-policy`
          (tax is computed on the post-discount amount, not the raw
          subtotal) — this was real and consistently implemented, but had
          never been written down.
        - Added `x-rendering-policy`, documenting that rendered amounts
          must use the number-formatting convention of the document's own
          `currency`, not a fixed locale.
        - Tightened `DocumentTypeInfo.name`'s description to state it is
          the canonical human-readable label for a document type, to be
          reused anywhere a type is shown to a user (not just the main
          page picker) — the PDF title bug happened because the renderer
          re-derived a title from the raw enum instead of reusing this.
      0.5.0 — Added `sales_order` to `DocumentType`. We agreed document
        types should track what invoice-generator.com itself offers, and
        comparing its 12 generators against our 11 types found exactly one
        gap: it has a Sales Order Generator and we didn't have a matching
        type. A real Sales Order PDF generated from that site (Bill To +
        Ship To + Expected Delivery + PO Number, priced line items, no
        discount used) confirmed it's a distinct billing-style document,
        not a duplicate of Purchase Order (money in the opposite direction
        — a supplier sends you a purchase order, you send a customer a
        sales order) or Work Order (describes work performed, not goods
        ordered). Scope of this change is the enum value only — it does
        not add new fields like an "expected delivery" date distinct from
        `due_date`; that's a separate, not-yet-made decision.
      0.6.0 — Merged in the two gaps found earlier while comparing a real
        generated `credit_note` against this spec (these were drafted
        alongside 0.5.0 but landed in a diverged copy — reconciled here):
        - Added `related_document_number`, a free-text field (same
          never-validated philosophy as `number`) so a `credit_note` can say
          which invoice it credits.
        - Renamed `amount_paid`/`balance_due` to `amount_settled`/
          `balance_remaining` and added `x-settlement-policy`: same shared
          fields across all 12 document types, but meaning depends on
          `type` — money received for money-owed-to-you types, money
          refunded back to the customer for `credit_note`.
      0.7.0 — Documented security behavior that was already implemented but
        absent from (and, for lockout, contradicted by) the spec/docs:
        - Added `x-security-policy` describing account lockout (5 failed
          login attempts → 5-minute lockout, per account) and per-IP rate
          limiting on the `/auth` endpoints (20 requests/minute → `429`).
        - Added a reusable `429 Too Many Requests` response and referenced
          it on all six `/auth` operations (the limiter is applied to the
          whole group and runs before authentication).
        - Noted on `POST /auth/login` that a locked account currently
          surfaces as `401`, indistinguishable from bad credentials (a
          future `423 Locked` would separate them — a code change).
        No request/response shapes changed; this is documentation catching
        up to the implementation.
      0.8.0 — Added Email delivery (was previously deferred; see
        `x-future-phases` for the remaining deferred items):
        - Added `POST /documents/{documentId}/send`, which emails the
          rendered PDF to a customer. See `x-email-delivery-policy` for the
          full design (recipient resolution, async behavior, and how a
          delivery failure is surfaced).
        - Added `SendDocumentRequest` (`to_email`, `message`, both optional).
        - Added five fields to `Document`: `last_sent_at`, `send_count`,
          `last_send_status`, `last_send_error`. See `x-email-delivery-policy`
          for what each one means and when it updates.
        - `POST /documents/{documentId}/send` reuses the existing `429 Too
          Many Requests` response, so it can be rate-limited the same way
          `/auth` is, since it's another endpoint that could be abused to
          spam a third party's inbox.
      0.9.0 — Made `Document` round-trip what `CreateDocumentRequest`
        accepts, so a GET (and the create/list/send responses, which share
        the schema) returns enough to prefill the create form. Purely
        additive to the response shape — `CreateDocumentRequest` is
        unchanged. Added to `Document`:
        - The submitted inputs, reusing `CreateDocumentRequest`'s exact
          field names/shapes: `date`, `due_date`, `items` (array of
          `LineItem`), `tax_percent`, `discount_percent`, `shipping_amount`,
          `notes`, and `terms`.
        - `discount_amount` and `tax_amount`, the computed totals produced
          by `discount_percent`/`tax_percent`. (These were already returned
          by the implementation but had never been documented on the
          schema; documenting them here alongside their inputs.)
      0.10.0 — Added a per-document business logo, stamped onto the PDF header:
        - Added `include_logo` (boolean, default `true`) to
          `CreateDocumentRequest`. When true and the user has a profile
          `logo_url` set (via `POST /auth/me/logo`), that URL is copied onto the
          new document at creation time; set it to `false` to create a
          document with no logo even when the profile has one.
        - Added `logo_url` (nullable string) to `Document`. This is a FROZEN
          SNAPSHOT captured at creation, NOT a live reference to the user's
          profile — exactly the same reasoning as the `to`
          name/address snapshot in `x-customer-policy`: a document is a
          point-in-time record, so re-branding, changing, or removing the
          profile logo later must not silently rewrite the logo on documents
          already issued. The PDF renderer reads this field, never the
          current profile. `null` means the document was created without a
          logo (opted out, or no profile logo was set at the time).
        - The rendered logo is capped to a modest header box so it can never
          crowd out or obscure the legally required fields (seller info,
          document number, dates, tax breakdown, totals).
      0.11.0 — Added recording a settlement against a document — the small,
        "record that a payment happened" half of the deferred Payments item in
        `x-future-phases`, explicitly NOT the processor/Stripe integration (no
        webhooks, no PCI scope, no external money movement — that half stays
        deferred):
        - Added `POST /documents/{documentId}/settlement`, which adjusts a
          document's `amount_settled` by a single signed `amount` and returns
          the updated `Document`. A distinct sub-resource, not a general
          `PATCH /documents/{id}` (there deliberately isn't one).
        - Added `RecordSettlementRequest` (`amount`, decimal). Positive records
          a payment/refund received; negative corrects an earlier mistaken
          entry (there's no separate payment history — this is the one way to
          fix a mistake). `new_amount_settled = amount_settled + amount` must
          land within `[0, total]`, else `422` with the error mapped to the
          `amount` field. Direction ("paid" vs "refunded for `credit_note`") is
          governed by `x-settlement-policy`; the arithmetic and bound are the
          same either way.
      0.12.0 — Added self-service account deletion:
        - Added `DELETE /auth/me`, which permanently deletes the caller's own
          account immediately, with no grace period and no undo. See the new
          `x-account-policy` for the full behavior.
        - Soft-deletes (existing `DeletedAt` convention) the user row and all
          of that user's documents and customers, revokes every one of the
          user's refresh tokens (all sessions end at once, not just the
          caller's), and blocks future logins: `POST /auth/login` fails for a
          deleted account exactly like bad credentials (401), never leaking
          that the account was deleted — same rationale as account lockout in
          `x-security-policy`.
        - A deleted user's email address is released for reuse: the same
          address can be registered again via `POST /auth/register`. No
          request/response shapes changed on other endpoints.
      0.13.0 — Added an unauthenticated guest document flow so first-time
        visitors can try the product before creating an account:
        - Added `POST /documents/guest` (`security: []`). It validates the
          request, computes totals via the SAME `x-rounding-policy` path as
          `POST /documents`, renders the PDF, and streams it back directly
          (`200 application/pdf`). It persists NOTHING — no `Document` row, no
          history, no `id`. See the new `x-guest-document-policy`.
        - Added `GuestCreateDocumentRequest`: the same shape as
          `CreateDocumentRequest` minus `customer_id`, with `from` required
          (no saved profile to fall back on) and no `include_logo`.
        - Reuses the existing `429 Too Many Requests` mechanism, on its own
          per-IP window starting at 10/minute (tighter than `/auth`'s 20/minute
          because PDF rendering is heavier per call). This is an abuse/cost
          guard only, unrelated to any frontend "N free documents" limit.
      0.14.0 — Added "Continue with Google" as a second sign-in/sign-up method
        alongside email/password:
        - Added `POST /auth/google` (`security: []`). The client obtains a
          Google ID token (a JWT) from Google Sign-In and posts it as
          `{ "id_token": "<jwt>" }`. The server verifies it against Google's
          public keys (signature, expiry, issuer, and audience against the
          configured Google client id) — a client-decoded, unverified payload
          is never trusted. On success it returns the SAME `AuthResponse` shape
          as `POST /auth/login` (access + refresh token pair + user).
        - Added `GoogleSignInRequest` (`id_token`, required).
        - Account matching is by the verified, normalized email: an existing
          Google-linked account logs in; an existing password account with no
          Google link is auto-linked (safe because Google has verified the
          email is theirs) and logged in; an unknown email creates a new,
          password-less account with `email_verified` already true (Google
          did the verifying). See the new `x-google-auth-policy`.
        - A token whose `email_verified` is not true is rejected (`422`), and
          an invalid/expired/tampered token is rejected (`401`) — no account is
          created or linked off an unverified or unverifiable email.
        - `POST /auth/login` now returns a distinct `409` with code
          `account_uses_google_auth` (instead of a generic `401`) when the
          target account was created via Google and has no password set, so the
          frontend can steer the user to "Continue with Google" rather than
          showing "wrong password". No other request/response shapes changed.

security:
  - BearerAuth: []

x-rounding-policy:
  numeric_type: >-
    All monetary fields (see the `MonetaryAmount` schema) MUST be handled as
    fixed-point decimals server-side — in .NET Core, that means the C#
    `decimal` type everywhere (models, EF Core entities/DB columns, DTOs),
    never `double` or `float`. This was verified concretely: in real C#,
    `0.1m + 0.2m` equals exactly `0.3m`, while the same expression with
    `double` produces `0.30000000000000004`. JSON itself has no decimal
    type, but .NET's JSON serializer round-trips `decimal` through JSON
    number tokens exactly (it parses the token text directly into
    `decimal`, not via `double`), so no extra encoding (e.g. strings or
    integer minor units) is needed for a .NET-to-.NET boundary.
  tax_rounding: >-
    Tax is calculated PER LINE ITEM (line_total * tax_percent / 100), each
    line's tax individually rounded to 2 decimal places using round-half-
    away-from-zero (.NET: MidpointRounding.AwayFromZero), and THEN the
    already-rounded per-line tax amounts are summed to get the document's
    total tax. This was a deliberate choice, not a technical default: a
    reader looking at the document line-by-line expects each line's tax to
    look individually correct, the way a person calculating it by hand
    would show it — at the cost of occasionally differing by 1 minor unit
    from "tax computed once on the subtotal."
    Worked example (verified in real C#, not hypothetical): subtotal
    $191.78 at 8.5% tax — per-line rounding gives $5.10 + $3.87 + $7.34 =
    $16.31 total tax; rounding once on the subtotal instead gives $16.30.
    Both are "correct" methods; this API always uses the per-line one, so
    implementations must apply it consistently or totals will mismatch
    what a client re-derives from the individual line items.
  discount_tax_ordering: >-
    Discount is applied BEFORE tax: tax is calculated on the subtotal
    AFTER `discount_percent` has been subtracted, never on the raw
    subtotal. This is a real, consistently-applied business decision, not
    an implementation detail — computing tax on the pre-discount subtotal
    is also a defensible method, but this API does not use it, so
    implementations must apply this ordering or totals will mismatch what
    a client re-derives from `subtotal`, `discount_percent`, and
    `tax_percent`.
    Worked example (verified arithmetic, not hypothetical): subtotal
    $4,520.00 with a 5% discount ($226.00) leaves $4,294.00; 21% tax on
    that discounted amount is $901.74. Applying 21% tax to the raw
    $4,520.00 subtotal instead would give $949.20 — a different, incorrect
    number. This API always produces $901.74 for these inputs.
  discount_application: >-
    Discount is applied PER LINE ITEM, before that line's tax — the same
    one-line-at-a-time discipline as `tax_rounding`, never a single
    lump-sum discount on the whole subtotal. For each line: take its
    `line_total` (quantity × unit_cost), subtract `discount_percent`, and
    round the discounted amount to 2 decimal places
    (MidpointRounding.AwayFromZero) — that is the line's discounted amount.
    Then compute `tax_percent` on THAT discounted amount and round to 2
    decimal places. The document's total tax is the sum of the per-line
    rounded taxes; the post-discount total is the sum of the per-line
    rounded discounted amounts (plus tax, plus shipping, minus amount paid).
    The reported `subtotal` field stays PRE-discount — the raw sum of
    line_totals ($4,520.00 in the example below). Discount is a reduction
    shown separately on the rendered document (Subtotal, then a Discount
    line, then Tax, then Total), NOT folded into `subtotal`.
    Chosen over "discount the whole subtotal once, then split it back across
    lines to tax each": that alternative would require inventing a
    proportional allocation with a leftover-cent rule, whereas per-line
    discounting keeps everything inside the existing per-line pattern. Like
    `tax_rounding`, this can differ by 1 minor unit from the lump-sum method
    on some inputs — the same, already-accepted tradeoff applied one step
    earlier.
    Worked example (verified): two lines of $3,200.00 and $1,320.00 at 5%
    discount and 21% tax. Line 1 → $3,040.00 discounted → $638.40 tax.
    Line 2 → $1,254.00 discounted → $263.34 tax. Reported subtotal
    (pre-discount) $4,520.00, discount $226.00, tax $901.74 — matching
    discount_tax_ordering.

x-rendering-policy:
  currency_correct_number_formatting: >-
    Rendered documents (PDF, and any future rendering surface) MUST format
    monetary amounts using the number-formatting convention that actually
    matches the document's own `currency` field — thousands separator,
    decimal separator, and symbol placement — not a single fixed
    culture/locale applied regardless of currency. Concretely: a USD
    document must render as `$5,220.74` (comma thousands separator,
    period decimal separator), never as `5 220,74` (space thousands
    separator, comma decimal separator — a European-style grouping) just
    because the rendering code defaults to one locale. This bug class is
    invisible until a document is generated in a currency whose
    conventional formatting differs from whatever locale the renderer
    happens to default to, so it must be driven off `currency` explicitly
    rather than assumed.

x-settlement-policy:
  direction_depends_on_type: >-
    `amount_settled` and `balance_remaining` (on `CreateDocumentRequest` and
    `Document`) are one shared pair of fields reused across all 12 document
    types, but which direction the money moves depends on `type`:
    for money-owed-TO-you types (invoice, receipt, quote, estimate,
    proforma_invoice, purchase_order, statement, timesheet, work_order,
    packing_slip, sales_order), `amount_settled` is how much the customer
    has PAID toward `total`, and `balance_remaining` is what they still owe.
    For `credit_note`, the money flows the other way: `total` is the
    credit owed BACK to the customer, `amount_settled` is how much of
    that credit has actually been REFUNDED to them so far, and
    `balance_remaining` is the credit not yet refunded.
  why_one_shared_pair: >-
    A real credit note generated for comparison (invoice-generator.com's
    credit note template) has its own separate "Refunded" field distinct
    from its totals block — confirming this is a real, direction-dependent
    concept, not something to paper over. This spec still uses ONE shared
    pair of fields (not `amount_paid`/`amount_refunded` as two separate
    fields) so `CreateDocumentRequest`/`Document` stay a single uniform
    shape across every document type — a renderer or client only needs to
    know `type` to know which direction `amount_settled` means, not to
    branch on which of two field-name pairs is present.
  renaming_note: >-
    Previously named `amount_paid`/`balance_due` (through 0.4.0). Renamed
    because "amount paid" has no sensible reading for a `credit_note` —
    money isn't being paid to you, it's being refunded by you. Pre-1.0,
    pre-implementation spec, so this is a plain rename, not a breaking
    migration.

x-customer-policy:
  snapshot_not_live_link: >-
    A Document's `to` field is a frozen snapshot of the customer's
    name/address AT THE TIME THE DOCUMENT WAS CREATED — it is NOT a live
    view of the current Customer record. `customer_id` on a Document is
    kept only as a reference for filtering/lookup (e.g. "show me all
    invoices for this customer"); it does not mean the document's displayed
    `to` text updates if the customer's address is edited later.
  why: >-
    An invoice is a legal/financial record of what was billed at a point in
    time. If a customer moves and updates their saved address, past
    invoices must still show the address that was actually correct when
    they were issued — not silently rewrite history. This matches how real
    invoicing/accounting software behaves, and is the same reasoning as
    "line items are stored on the document, not recomputed from a live
    product catalog."
  deletion: >-
    Deleting a Customer is a SOFT delete (a `deleted_at` timestamp, not a
    row removal). A deleted customer disappears from `GET /customers` and
    can no longer be used for new documents (`customer_id` on
    `POST /documents` referencing a deleted customer returns a 422
    validation error) — but existing documents keep their frozen `to` text
    and their `customer_id` reference untouched, so historical records and
    "list documents for this customer" filtering still work. A hard delete
    was rejected: it would either orphan `Document.customer_id` or force
    cascading deletes that destroy financial history, which is worse than
    the small complexity cost of a soft-delete flag.

x-security-policy:
  account_lockout: >-
    Login enforces account lockout via ASP.NET Core Identity: after 5
    consecutive failed password attempts a user is locked out for 5 minutes.
    While locked, even a correct password is rejected. This is per-account
    (it protects one account from password-guessing) — it does NOT stop the
    same password being sprayed across many accounts; see rate_limiting for
    that layer. A locked account currently surfaces on `POST /auth/login` as
    a `401` (same status as bad credentials), so a client cannot distinguish
    "locked" from "wrong password" from the status alone.
  rate_limiting: >-
    The `/auth` endpoints are rate-limited per client IP: a fixed window of
    20 requests per minute per IP. Exceeding it returns `429 Too Many
    Requests`. This is the complement to account_lockout — it throttles
    brute-force/spray attempts from a single origin regardless of which
    account is targeted. (Disabled in the automated test environment so the
    suite's same-IP calls aren't throttled.)

x-account-policy:
  self_service_deletion: >-
    `DELETE /auth/me` lets a logged-in user permanently delete their OWN
    account. It happens immediately — there is no grace period, no soft
    "deactivate then purge later," and no undo endpoint. Returns `204 No
    Content`.
  what_gets_soft_deleted: >-
    Deletion reuses the existing `DeletedAt` soft-delete convention (see
    `x-customer-policy`) rather than physically removing rows: the user row,
    every document owned by the user, and every customer owned by the user
    are stamped deleted. Rows are kept (they stay out of all normal queries
    via the same global filter that hides a soft-deleted document/customer),
    but the account is unusable from that moment on. Because documents are
    hidden by that filter, any email send already queued for one of them
    becomes a no-op when the background worker reloads it — so deletion can't
    be "undone" by an in-flight job acting on stale state.
  sessions_revoked_everywhere: >-
    All of the user's refresh tokens are revoked, not just the one on the
    deleting request — every active session is logged out at once. Access
    tokens are short-lived and stateless (see AuthResponse `expires_in`), so
    an already-issued access token keeps working until it expires on its own
    (~minutes); it cannot be used to obtain a new one because refresh is
    revoked.
  login_blocked_indistinguishably: >-
    After deletion, `POST /auth/login` fails for that account exactly like a
    wrong password — a `401` with no hint that the account was deleted. This
    is the same non-leaking rationale as account lockout in
    `x-security-policy.account_lockout`.
  email_freed_for_reuse: >-
    The email address of a deleted account is released and becomes available
    again for `POST /auth/register` — the person deliberately left, so they
    (or anyone) may sign up fresh with that address later. The uniqueness
    check on registration therefore does NOT treat a deleted account's email
    as still taken; a brand-new, unrelated account is created (it inherits
    none of the deleted account's data).

x-google-auth-policy:
  token_verification: >-
    `POST /auth/google` accepts a Google ID token (a JWT the client obtained
    from Google Sign-In) and verifies it SERVER-SIDE against Google's public
    keys — checking signature, expiry, issuer, and that the audience matches
    this app's configured Google client id. The unverified, client-decoded
    payload is never trusted for identity. A token that fails verification
    (invalid, expired, tampered, or wrong audience) is rejected with `401`.
  email_must_be_verified: >-
    The verified token must have `email_verified: true`. If it does not, the
    request is rejected with `422` and no account is created or linked — the
    whole point of trusting Google is that Google has confirmed the person
    owns the email address.
  account_matching: >-
    Matching is by the token's verified email, using the same case-insensitive
    normalization as `POST /auth/login`. (1) If an account already has this
    Google `sub` stored, it logs in. (2) If a password-based account exists
    for the email but has no Google link yet, the `sub` is stored on that row
    (auto-link) and it logs in — no extra confirmation step, because Google
    has already proven the email is theirs. (3) If no account matches, a new
    account is created with the email, the Google `sub`, no password, and
    `email_verified` already true (Google did the verifying, so any app-level
    email-confirmation flow is skipped). In every case the response is the
    standard `AuthResponse` (access + refresh pair + user), identical to
    `POST /auth/login`.
  password_login_of_google_account: >-
    An account created via Google has no password. If someone then tries
    `POST /auth/login` with that email, they get a distinct `409` with code
    `account_uses_google_auth` (not the generic `invalid_credentials` 401), so
    the frontend can prompt "Continue with Google" instead of "wrong password".

x-email-delivery-policy:
  recipient_resolution: >-
    `POST /documents/{documentId}/send` needs a recipient email address,
    which — unlike `to` (a frozen free-text name/address blob) — must be a
    real, structured email address. Resolution order: if the request body's
    `to_email` is given, it always wins. Otherwise, if the document has a
    `customer_id`, the linked Customer's current `email` is used (this is a
    LIVE lookup at send time, not the frozen `to` snapshot — see
    `x-customer-policy` — because an out-of-date email address would mean
    the send silently fails or goes to the wrong inbox, which is worse than
    a documented exception to the snapshot rule). If neither produces an
    email address (no `customer_id`, or the linked customer has no `email`
    on file, or that customer was soft-deleted), the request is rejected
    with `422`.
  asynchronous_delivery: >-
    Sending is asynchronous: the endpoint validates the request, resolves
    the recipient, enqueues the send, and returns `202 Accepted` — it does
    NOT wait for the email provider to confirm delivery. `send_count` on
    `Document` increments immediately (it counts attempts, including
    retries after a failure), but `last_sent_at` and `last_send_status` are
    updated by the background worker once it actually attempts the send —
    so immediately after the `202` response, those fields may still reflect
    a previous send (or be unset, on a first send). Clients that need to
    show up-to-date status should re-fetch the document (e.g. `GET
    /documents/{id}`) rather than trust the `202` response body alone.
  status_and_failure_visibility: >-
    `last_send_status` (`queued` / `sent` / `failed`) and `last_send_error`
    (a short human-readable reason, present only when `last_send_status` is
    `failed`) together let the frontend show the user an alert when a send
    didn't go through — e.g. "Failed to send: Recipient address rejected" —
    rather than the failure being silently swallowed server-side.
    `last_send_status` reflects only the MOST RECENT attempt; retrying a
    failed send (calling the endpoint again) overwrites it once that new
    attempt resolves. `last_sent_at` only updates on an actual successful
    delivery, so it always answers "when did this last actually reach the
    customer," independent of how the most recent attempt went.
  subject_and_message: >-
    The email subject is always auto-generated from `DocumentTypeInfo.name`
    and the document's `number` (e.g. "Invoice INV-0042 from Acme Co.") —
    not customizable, so it stays consistent — reusing the same canonical
    naming rule as PDF titles (see `DocumentTypeInfo.name`). The request's
    optional `message` field is included in the email body as a free-text
    note from the sender; if omitted, a generic default body is used.
  rate_limiting: >-
    Reuses the same per-IP rate limiting and `429 Too Many Requests`
    response as `/auth` (see `x-security-policy.rate_limiting`) — this
    endpoint sends email to a third party on the caller's behalf, so it
    needs the same abuse protection.

x-guest-document-policy:
  purpose: >-
    `POST /documents/guest` lets a first-time, unauthenticated visitor generate
    a real PDF before committing to an account — a "try before you sign up"
    flow. It exists so the product's core value (a nicely rendered document) can
    be experienced with zero friction.
  no_persistence: >-
    This endpoint is STATELESS with respect to the database: it writes NOTHING.
    No `Document` row, no line items, no history, no `id`. It validates the
    request, computes the totals, renders the PDF, and streams the bytes back —
    then the in-memory document is discarded. This is the defining difference
    from `POST /documents`, which persists first and renders on demand later.
    Because nothing is stored, there is also nothing to later fetch, download
    again, list, email, or settle — a guest who wants any of that must sign up
    and use the authenticated create path.
  calculation_reuse: >-
    Totals are computed by the EXACT same code path as `POST /documents` — the
    same per-line-item tax rounding and `decimal` arithmetic described in
    `x-rounding-policy`. The guest path only skips persistence; it does not
    re-implement (or subtly diverge from) the money math. A guest PDF and an
    authenticated PDF built from the same inputs are identical.
  response_shape: >-
    Unlike `POST /documents` (which returns a JSON `Document`), this returns the
    PDF directly as `application/pdf` with `200 OK`. There is no create-then-GET
    two-step and no document record in the body.
  rate_limiting: >-
    Rate limited per client IP using the same `429 Too Many Requests` mechanism
    as `/auth` and `/documents/{documentId}/send`, but on its OWN window,
    starting at 10 requests/minute/IP — tighter than the 20/minute used for
    `/auth`, because rendering a PDF is far heavier per call than an auth check,
    so it is a bigger cost/abuse lever. This limit is purely a server-side
    abuse/cost guard. It is UNRELATED to any "N free documents before you must
    sign up" product limit — that is a frontend-only concern this endpoint knows
    nothing about and does not enforce (it cannot: it stores no state to count
    against).

servers:
  - url: https://api.example.com/v1
    description: Replace with your real API base URL once deployed.

tags:
  - name: auth
    description: Account registration, login, and session/token management
  - name: document-types
    description: The list of generatable document types, for the main page picker
  - name: customers
    description: Saved customer records that documents can reference instead of free text
  - name: documents
    description: Create, list, retrieve, download, and delete generated documents

paths:
  # ---------------------------------------------------------------- AUTH ----
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Create a new account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: An account with this email already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: >-
            Incorrect email or password, OR the account is temporarily locked
            after too many failed attempts (see x-security-policy.account_lockout —
            a lock currently surfaces as 401, indistinguishable from bad credentials),
            OR the account was deleted via DELETE /auth/me (also indistinguishable —
            see x-account-policy.login_blocked_indistinguishably).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: >-
            The account was created via "Continue with Google" and has no
            password (code `account_uses_google_auth`). This is deliberately
            distinct from the `401` above so the client can steer the user to
            Google sign-in — see x-google-auth-policy.password_login_of_google_account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/google:
    post:
      operationId: googleSignIn
      tags: [auth]
      summary: Sign in or sign up with a Google ID token
      description: |
        Exchanges a Google Sign-In ID token for this app's own access +
        refresh token pair, creating or linking a local account as needed.
        The ID token is verified server-side against Google's public keys
        (signature, expiry, issuer, audience). See `x-google-auth-policy`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
      responses:
        '200':
          description: Signed in — account logged in, linked, or created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: >-
            The Google ID token could not be verified (invalid, expired,
            tampered, or wrong audience) — see
            x-google-auth-policy.token_verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: >-
            The verified token's email is not verified by Google
            (`email_verified` is not true) — see
            x-google-auth-policy.email_must_be_verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Exchange a refresh token for a new access token
      description: |
        Access tokens are short-lived (see `expires_in` on AuthResponse).
        Call this before/when one expires, using the longer-lived refresh
        token, instead of asking the user to log in again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Refresh token is invalid, expired, or was revoked (e.g. by logout).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Revoke the current refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Logged out — the refresh token no longer works.
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the logged-in user's profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateCurrentUser
      tags: [auth]
      summary: Update the logged-in user's profile (e.g. default business info)
      description: |
        Lets a user save their own business name/address/logo once, so it can
        pre-fill the "Who is this from?" field on the document form instead of
        retyping it every time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteCurrentUser
      tags: [auth]
      summary: Permanently delete the logged-in user's account
      description: |
        Permanently and immediately deletes the caller's own account — no grace
        period, no undo. Soft-deletes the user, their documents, and their
        customers; revokes ALL of the user's refresh tokens (every session is
        logged out, not just this one); blocks future logins (a deleted account
        fails `POST /auth/login` exactly like bad credentials); and releases the
        email address for reuse via `POST /auth/register`. See `x-account-policy`.
      responses:
        '204':
          description: Account deleted. All sessions are revoked; the email is free to reuse.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/me/logo:
    post:
      operationId: uploadUserLogo
      tags: [auth]
      summary: Upload a business logo from the user's device
      description: |
        Stores the image server-side (Postgres) and sets the user's `logo_url` to a
        short, browser-loadable retrieval URL (`GET /auth/logo/{logoId}`), returning the
        updated profile so the frontend can drop it straight into its auth state.

        The server is the authority on the image: it sniffs the actual bytes (the declared
        content type is not trusted), rejects anything it can't decode as a raster image
        (PNG/JPEG/WebP/GIF; SVG is rejected), rejects uploads over 5 MB, and downscales +
        re-encodes to a bounded PNG. Each upload gets a fresh `logoId`, so the retrieval
        URL changes and browser/PDF caches can't mask a re-upload.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The image file (max 5 MB; PNG/JPEG/WebP/GIF).
      responses:
        '200':
          description: Logo stored; returns the updated profile with the new `logo_url`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: >-
            No file, an unreadable/non-image file, or a file over 5 MB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteUserLogo
      tags: [auth]
      summary: Clear the user's uploaded logo
      description: >-
        Removes the stored image and nulls `logo_url`, returning the updated profile.
        (Setting `logo_url` to `""` via `PATCH /auth/me` also clears the URL, but only this
        endpoint removes the stored bytes.)
      responses:
        '200':
          description: Logo cleared; returns the updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logo/{logoId}:
    parameters:
      - name: logoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getUserLogo
      tags: [auth]
      summary: Fetch a stored logo image by its opaque id
      description: >-
        Public and unauthenticated — an `<img>` tag (and the PDF renderer) can't send a
        bearer token, so access control is the unguessable, non-enumerable `logoId` rather
        than the user id. Not covered by the `/auth` rate limiter.
      security: []
      responses:
        '200':
          description: The logo image bytes.
          content:
            image/png:
              schema: { type: string, format: binary }
        '404':
          description: No logo exists with that id.

  # ------------------------------------------------------- DOCUMENT TYPES ----
  /document-types:
    get:
      operationId: listDocumentTypes
      tags: [document-types]
      summary: List the document types the main page lets a user choose from
      description: |
        Public, unauthenticated — the landing page calls this to render its
        "what do you want to create?" choices (Invoice, Receipt, Quote, ...)
        without hardcoding the list in the frontend.
      security: []
      responses:
        '200':
          description: Available document types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentTypeInfo'

  # ----------------------------------------------------------- CUSTOMERS ----
  /customers:
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Save a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

    get:
      operationId: listCustomers
      tags: [customers]
      summary: List the logged-in user's saved customers
      description: >-
        Excludes soft-deleted customers. Ordered by `name` ascending by
        default (customers are picked from a list while filling out a
        document form, so alphabetical is more useful here than
        newest-first).
      parameters:
        - name: search
          in: query
          description: Case-insensitive substring match against customer name.
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 20 }
      responses:
        '200':
          description: Paginated list of customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get one customer's details
      responses:
        '200':
          description: The customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer's details
      description: >-
        Only affects future documents (or the picker UI) — does NOT alter
        the `to` text on documents already created from this customer. See
        `x-customer-policy` at the root of this spec.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Soft-delete a customer
      description: >-
        Sets `deleted_at`; does not remove the row. The customer stops
        appearing in `GET /customers` and can no longer be referenced by
        new documents, but documents already created from it are
        unaffected — see `x-customer-policy`.
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------- DOCUMENTS ----
  /documents:
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create a document by submitting the filled-out form
      description: |
        Validates and stores the submitted form data, renders it to PDF, and
        returns the saved document's record (including a URL to download the
        PDF). Unlike invoice-generator.com's API, this does NOT stream the PDF
        directly back from this call — the document is persisted first so it
        shows up in the user's history, and the PDF is fetched separately via
        `GET /documents/{id}/pdf`. This keeps the create response fast and JSON,
        which is what a web UI wants (it can render a summary immediately and
        offer a "Download PDF" button).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Document created and rendered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

    get:
      operationId: listDocuments
      tags: [documents]
      summary: List the logged-in user's documents (history)
      description: >-
        Ordered by `created_at` descending by default (most recent first).
        The frontend relies on this order for its "suggest the next
        document number" convenience — see CreateDocumentRequest.number —
        by requesting `per_page=1` for the relevant type.
      parameters:
        - name: type
          in: query
          description: Filter by document type.
          schema:
            $ref: '#/components/schemas/DocumentType'
        - name: customer_id
          in: query
          description: Filter to documents created from this customer (works even after the customer is soft-deleted).
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 10 }
      responses:
        '200':
          description: Paginated list of documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /documents/guest:
    post:
      operationId: createGuestDocument
      tags: [documents]
      summary: Render a document to PDF without an account (nothing is stored)
      security: []
      description: |
        The "try before you sign up" endpoint. Unauthenticated (`security: []`)
        — a first-time visitor can fill out the form and get a real PDF before
        creating an account.

        Unlike `POST /documents`, this endpoint does NOT persist anything: no
        `Document` row, no line items, no history. It validates the request,
        computes the totals using the EXACT same calculation path as
        `POST /documents` (`x-rounding-policy`: per-line-item tax, `decimal`
        throughout), renders the PDF, and streams it straight back as the
        response body. There is no create-then-fetch two-step and no `id` — the
        result is the PDF itself, not a JSON record. See
        `x-guest-document-policy` for the full rationale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestCreateDocumentRequest'
      responses:
        '200':
          description: The rendered PDF, streamed directly (not stored).
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get one document's details
      responses:
        '200':
          description: The document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Soft-delete a document
      description: >-
        Sets `deleted_at`; does not remove the row. The document stops
        appearing in `GET /documents`, `GET /documents/{id}`, and the PDF/send
        endpoints (all return 404 afterward). The response shape is unchanged.
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/{documentId}/pdf:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: downloadDocumentPdf
      tags: [documents]
      summary: Download the rendered PDF
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/{documentId}/send:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: sendDocument
      tags: [documents]
      summary: Email the rendered PDF to a customer
      description: >-
        Enqueues an email of this document's PDF to a recipient. Asynchronous
        — see `x-email-delivery-policy` for recipient resolution, why this
        returns `202` instead of `200`, and how `last_send_status` /
        `last_send_error` on `Document` let the frontend surface a failure.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendDocumentRequest'
      responses:
        '202':
          description: >-
            Send enqueued. Does not mean delivery succeeded — see
            `x-email-delivery-policy.asynchronous_delivery`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >-
            No email address could be resolved (no `to_email`, and either no
            `customer_id` or the linked customer has no `email` on file) —
            or `to_email`, when given, is not a valid email address. See
            `x-email-delivery-policy.recipient_resolution`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /documents/{documentId}/settlement:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: recordSettlement
      tags: [documents]
      summary: Record a settlement (payment or refund) against a document
      description: >-
        Adjusts the document's `amount_settled` by a single signed `amount` and
        returns the updated `Document`. This is the "record that a payment
        happened" capability — NOT a payment-processor integration (no external
        money movement, no webhooks; see `x-future-phases`).


        The new value is `amount_settled + amount`, and it must stay within
        `[0, total]` (`balance_remaining` is recomputed as `total -
        amount_settled`). `amount` may be negative to correct a previous
        mistaken entry, since no separate payment history is kept — this is the
        one way to fix a mistake. A result below 0 or above `total` is rejected
        with `422`.


        What `amount_settled` *means* depends on `type` (see
        `x-settlement-policy`): for money-owed-to-you types it is money paid
        toward `total`; for `credit_note` it is how much of the credit has been
        refunded. The endpoint's arithmetic and the `[0, total]` bound are
        identical either way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordSettlementRequest'
      responses:
        '200':
          description: Settlement recorded; the updated document is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >-
            The resulting `amount_settled` would fall outside `[0, total]`
            (either below 0, or above the document's `total`). The error is
            reported against the `amount` field.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationErrorResponse' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token returned by `/auth/login`, `/auth/register`,
        `/auth/google`, or `/auth/refresh`. Send as header "Authorization" with
        value "Bearer <access_token>".

  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing, invalid, or expired access token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource does not exist, or does not belong to the current user.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: The request body failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorResponse' }
    TooManyRequests:
      description: >-
        Rate limit exceeded (see x-security-policy.rate_limiting). Retry after
        the window resets.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: "invalid_credentials"
            message:
              type: string
              example: "Incorrect email or password."

    ValidationErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, fields]
          properties:
            code: { type: string, example: "validation_failed" }
            message: { type: string, example: "One or more fields are invalid." }
            fields:
              type: array
              items:
                type: object
                properties:
                  field: { type: string, example: "items[0].unit_cost" }
                  message: { type: string, example: "must be a positive number" }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        business_name: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    GoogleSignInRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: >-
            The ID token (a JWT) issued by Google Sign-In on the client. It is
            verified server-side against Google's public keys; the app never
            trusts a client-decoded payload. See `x-google-auth-policy`.

    UpdateUserRequest:
      type: object
      properties:
        business_name: { type: string }
        business_address: { type: string, description: "Multiline, used to pre-fill the 'from' field." }
        logo_url: { type: string, format: uri }
        default_currency: { type: string, example: "EUR" }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        business_name: { type: string, nullable: true }
        business_address: { type: string, nullable: true }
        logo_url: { type: string, format: uri, nullable: true }
        default_currency: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: "Bearer" }
        expires_in: { type: integer, description: "Access token lifetime in seconds.", example: 900 }

    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          properties:
            user:
              $ref: '#/components/schemas/User'

    DocumentType:
      type: string
      description: Which kind of document this is.
      enum:
        - invoice
        - receipt
        - credit_note
        - quote
        - estimate
        - proforma_invoice
        - purchase_order
        - statement
        - timesheet
        - work_order
        - packing_slip
        - sales_order
      default: invoice

    DocumentTypeInfo:
      type: object
      description: >-
        Metadata for one document type. Originally introduced for the main
        page's "what to generate" picker, but `name` in particular is now
        the canonical source of a type's display name — see its own
        description.
      properties:
        id:
          $ref: '#/components/schemas/DocumentType'
        name:
          type: string
          example: "Invoice"
          description: >-
            The canonical human-readable label for this document type.
            This is the single source of truth for how a type is displayed
            to a user, and MUST be reused anywhere a type is shown —
            the main page picker, PDF titles, and any future surface
            (email subject lines, etc.) — rather than re-derived from the
            raw `DocumentType` enum value. (The enum's `credit_note`, or a
            naive `.ToString()` on a `CreditNote` C# enum member, is not
            fit for display — this field is.)
        description: { type: string, example: "Bill a customer for products or services." }
        icon: { type: string, description: "Icon identifier for the frontend.", example: "invoice" }

    MonetaryAmount:
      type: number
      description: >-
        A decimal monetary amount (never a percentage). JSON has no native
        decimal type, so on the wire this is a plain JSON number — but it
        MUST be deserialized into a fixed-point decimal type server-side
        (.NET: `decimal`, never `double`/`float`) to avoid floating-point
        rounding errors. See the root-level `x-rounding-policy` for the
        full rationale and a worked example.
      x-dotnet-type: decimal
      example: 99.00

    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email, nullable: true }
        address: { type: string, nullable: true, description: Multiline. }
        phone: { type: string, nullable: true }
        notes: { type: string, nullable: true, description: 'Private notes, not shown on documents.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateCustomerRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        address: { type: string, description: Multiline. }
        phone: { type: string }
        notes: { type: string }

    UpdateCustomerRequest:
      type: object
      description: All fields optional — send only what's changing.
      properties:
        name: { type: string }
        email: { type: string, format: email }
        address: { type: string }
        phone: { type: string }
        notes: { type: string }

    CustomerList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Customer' }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    LineItem:
      type: object
      required: [name, quantity, unit_cost]
      properties:
        name: { type: string }
        description: { type: string }
        quantity: { type: number }
        unit_cost:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
        reference: { type: string }

    CreateDocumentRequest:
      type: object
      required: [type, to, date, items]
      description: The submitted form. `from` may be omitted if the user has set a default business profile via `PATCH /auth/me`.
      properties:
        type:
          $ref: '#/components/schemas/DocumentType'
        from:
          type: string
          description: "Billing organization's name/address. Falls back to the user's saved business profile if omitted."
        to:
          type: string
          description: >-
            Customer's name/address (multiline). If `customer_id` is also
            given and `to` is omitted, `to` is auto-filled from that
            customer's current name/address at creation time. An explicit
            `to` always wins over the customer's saved info. Once created,
            this text is frozen on the document — see `x-customer-policy`.
        customer_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Optional reference to a saved Customer (`POST /customers`).
            Purely for convenience (auto-filling `to`) and later filtering
            (`GET /documents?customer_id=...`) — a document never requires
            one, `to` can always just be typed as free text. Referencing a
            customer that doesn't exist or was deleted returns a 422.
        date: { type: string, format: date }
        due_date: { type: string, format: date, nullable: true }
        number:
          type: string
          nullable: true
          description: >-
            Optional free-text document number/reference, e.g. "INV-0042"
            or a custom scheme like "NBL-1321-DW". Stored exactly as
            submitted — the API never auto-generates it, validates it for
            uniqueness, or otherwise mutates it; if omitted it is simply
            left blank on the document.
            The FRONTEND may pre-fill this field as a convenience (not an
            API concern) by taking the user's most recent document of the
            same type — `GET /documents?type=...&per_page=1` is ordered
            newest-first for exactly this purpose — and incrementing a
            trailing numeric run with a conservative regex such as
            `^(.*?)(\d+)$` (so "INV-0042" -> "INV-0043"). If the previous
            number doesn't match that pattern (e.g. "NBL-1321-DW", where
            the digits aren't at the end), there is no reliable way to
            guess "the next one" — the frontend should leave the field
            blank rather than insert a wrong guess.
        related_document_number:
          type: string
          nullable: true
          description: >-
            Optional free-text reference to another document this one
            relates to — most commonly the invoice a `credit_note` is
            crediting, e.g. "INV-0042". Same free-text philosophy as
            `number`: never validated against, or linked by ID to, an
            actual document in this system — it may reference an invoice
            issued outside this system entirely, or from before this
            system existed. If omitted, left blank on the document.
            Meaningful mainly for `credit_note`; harmless but typically
            unused on other types.
        currency: { type: string, default: "USD" }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LineItem' }
        tax_percent:
          type: number
          default: 0
          description: 'e.g. 8.5 for 8.5%. See x-rounding-policy for how this is applied (per line item, not on the subtotal).'
        discount_percent:
          type: number
          default: 0
          description: 'e.g. 5 for 5%. Applied BEFORE tax — see x-rounding-policy (discount_tax_ordering) for the exact ordering and a worked example.'
        shipping_amount:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
          default: 0
        notes: { type: string }
        terms: { type: string }
        amount_settled:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
          default: 0
          description: >-
            Money already paid (most types) or already refunded
            (`credit_note`) against this document. See `x-settlement-policy`
            for the full, type-dependent explanation.
        include_logo:
          type: boolean
          default: true
          description: >-
            Whether to stamp the user's current profile logo (`logo_url`, set
            via `POST /auth/me/logo`) onto this document. When true (the default)
            and a profile logo exists, that URL is captured onto the
            document's `logo_url` AT CREATION TIME as a frozen snapshot — it
            is never re-read from the profile afterwards (same freeze rule as
            `to`; see `x-customer-policy`). Set to false to create a document
            with no logo even when the profile has one. If the profile has no
            logo, this has no effect and `logo_url` is null either way.

    GuestCreateDocumentRequest:
      type: object
      required: [type, from, to, date, items]
      description: >-
        The body for `POST /documents/guest` — the unauthenticated try-before-
        you-sign-up flow. Deliberately the SAME shape as `CreateDocumentRequest`
        with two differences: (1) `customer_id` is absent entirely — a guest has
        no saved customers, so `to` is always plain free text; and (2) `from` is
        REQUIRED rather than optional, because there is no signed-in business
        profile to fall back on. Everything else — the line items, the
        tax/discount/shipping inputs, `number`, dates, notes/terms — is
        identical, and the totals are computed by the exact same code path
        (`x-rounding-policy`). There is no `include_logo`: a guest has no profile
        logo to stamp. See `x-guest-document-policy`.
      properties:
        type:
          $ref: '#/components/schemas/DocumentType'
        from:
          type: string
          description: "Billing organization's name/address. REQUIRED here (no saved profile to fall back on, unlike CreateDocumentRequest)."
        to:
          type: string
          description: "Customer's name/address (multiline free text). Always required — a guest has no customer_id to auto-fill it from."
        date: { type: string, format: date }
        due_date: { type: string, format: date, nullable: true }
        number:
          type: string
          nullable: true
          description: 'Optional free-text document number, same policy as CreateDocumentRequest.number — never generated, validated, or mutated by the API.'
        related_document_number:
          type: string
          nullable: true
          description: 'Optional free-text reference, same policy as CreateDocumentRequest.related_document_number.'
        currency: { type: string, default: "USD" }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LineItem' }
        tax_percent:
          type: number
          default: 0
          description: 'See x-rounding-policy — applied per line item, identically to CreateDocumentRequest.'
        discount_percent:
          type: number
          default: 0
          description: 'Applied BEFORE tax — see x-rounding-policy (discount_tax_ordering).'
        shipping_amount:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
          default: 0
        notes: { type: string }
        terms: { type: string }
        amount_settled:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
          default: 0
          description: 'Same meaning/rules as CreateDocumentRequest.amount_settled — see x-settlement-policy.'

    SendDocumentRequest:
      type: object
      description: >-
        Both fields optional — an empty body is valid whenever the document
        has a `customer_id` with a saved email. See
        `x-email-delivery-policy.recipient_resolution`.
      properties:
        to_email:
          type: string
          format: email
          description: >-
            Overrides the linked Customer's saved email, if any. Required
            when the document has no `customer_id`, or that customer has no
            `email` on file.
        message:
          type: string
          description: >-
            Optional free-text note included in the email body. The subject
            line is always auto-generated and not customizable — see
            `x-email-delivery-policy.subject_and_message`.

    RecordSettlementRequest:
      type: object
      required: [amount]
      description: >-
        A single signed change to the document's `amount_settled`. Positive
        records a payment/refund received; negative corrects a previous mistaken
        entry (no separate payment history is kept — this is the one way to fix a
        mistake). The resulting `amount_settled + amount` must land within
        `[0, total]`. See `x-settlement-policy` for what "settled" means per
        `type`.
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/MonetaryAmount'
          description: >-
            Signed delta applied to `amount_settled` (may be negative). The
            resulting settled amount must stay within `[0, total]`, else `422`
            on the `amount` field.
          example: 100.00

    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          $ref: '#/components/schemas/DocumentType'
        status:
          type: string
          enum: [draft, generated]
          description: "Phase 1 only distinguishes 'saved but not rendered yet' vs 'PDF ready'. Statuses like sent/paid belong to a later phase (see x-future-phases)."
        number:
          type: string
          nullable: true
          description: 'Exactly what the user submitted (or null if left blank) — see CreateDocumentRequest.number for the full policy. Never generated or altered by the API.'
        related_document_number:
          type: string
          nullable: true
          description: 'Exactly what the user submitted (or null if left blank) — see CreateDocumentRequest.related_document_number for the full policy. Never generated, validated, or altered by the API.'
        from: { type: string }
        to: { type: string }
        logo_url:
          type: string
          format: uri
          nullable: true
          description: >-
            The business logo stamped onto this document's PDF header. A
            FROZEN snapshot of the user's profile `logo_url` captured when the
            document was created (only if `include_logo` was true and a
            profile logo was set) — NOT a live reference to the current
            profile. Editing or removing the profile logo later never changes
            this value, for the same point-in-time-record reason as `to` (see
            `x-customer-policy`). Null if the document was created with no logo
            (opted out via `include_logo: false`, or no profile logo existed
            at creation time).
        customer_id:
          type: string
          format: uuid
          nullable: true
          description: 'Reference to the Customer this was created from, if any. Kept even after that customer is soft-deleted (see x-customer-policy) — does not imply `to` reflects the customer''s current info.'
        currency: { type: string }
        date:
          type: string
          format: date
          description: 'Echoes back CreateDocumentRequest.date exactly as submitted, so a GET round-trips into the create form.'
        due_date:
          type: string
          format: date
          nullable: true
          description: 'Echoes back CreateDocumentRequest.due_date (null if omitted / not applicable to the type).'
        items:
          type: array
          items: { $ref: '#/components/schemas/LineItem' }
          description: 'The line items exactly as submitted on CreateDocumentRequest.items — same shape, so a GET round-trips into the create form.'
        subtotal:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
        discount_percent:
          type: number
          description: 'Echoes back CreateDocumentRequest.discount_percent — the input rate that produced discount_amount (0 if none). See x-rounding-policy.'
        discount_amount:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
          description: 'Computed total discount applied (subtotal minus the discounted subtotal). Driven by discount_percent — see x-rounding-policy.'
        tax_percent:
          type: number
          description: 'Echoes back CreateDocumentRequest.tax_percent — the input rate that produced tax_amount (0 if none). See x-rounding-policy.'
        tax_amount:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
          description: 'Computed total tax (sum of per-line-item tax). Driven by tax_percent — see x-rounding-policy.'
        shipping_amount:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
          description: 'Echoes back CreateDocumentRequest.shipping_amount — the flat shipping input added into total (0 if none).'
        total:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
        amount_settled:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
          description: 'Money paid (most types) or refunded (credit_note) so far. See x-settlement-policy.'
        balance_remaining:
          allOf: [{ $ref: '#/components/schemas/MonetaryAmount' }]
          description: 'total minus amount_settled. Owed by the customer (most types), or owed back to them (credit_note). See x-settlement-policy.'
        pdf_url:
          type: string
          format: uri
          description: "Same as GET /documents/{id}/pdf — provided here for convenience."
        last_sent_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When this document was last SUCCESSFULLY emailed via
            POST /documents/{id}/send. Null if it's never been sent. Only
            updates on success — see x-email-delivery-policy.
        send_count:
          type: integer
          default: 0
          description: >-
            How many times a send has been attempted (including retries
            after a failure) — not just successful sends. See
            x-email-delivery-policy.
        last_send_status:
          type: string
          nullable: true
          enum: [queued, sent, failed]
          description: >-
            Outcome of the MOST RECENT send attempt. Null if never sent.
            See x-email-delivery-policy.status_and_failure_visibility for
            how the frontend should use this to alert the user on failure.
        last_send_error:
          type: string
          nullable: true
          description: >-
            Short human-readable reason the most recent send failed. Only
            present when last_send_status is "failed"; null otherwise.
        notes:
          type: string
          nullable: true
          description: 'Echoes back CreateDocumentRequest.notes exactly as submitted (null if omitted).'
        terms:
          type: string
          nullable: true
          description: 'Echoes back CreateDocumentRequest.terms exactly as submitted (null if omitted).'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DocumentList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

x-future-phases:
  - name: Payments & webhooks
    description: >-
      The "record that a payment happened" half of this item shipped in
      0.11.0 as `POST /documents/{documentId}/settlement` (adjusts
      `amount_settled`; see `x-settlement-policy`) — that was the small,
      in-scope reading called out below. What REMAINS deferred is the big
      half: collecting payments via a processor like Stripe (PCI scope,
      webhook signature verification, idempotency, processor-driven refunds)
      plus a webhook subscription mechanism so external systems are notified
      on payment or status change. Explicitly scoped down (not designed) as
      of 0.3.0 — there's no near-term need to actually collect money through
      this system, so building it now would be speculative. Revisit once
      there's an actual use case.
  - name: UBL / e-invoice export
    description: >-
      GET /documents/{id}/ubl — structured XML export, mirroring
      invoice-generator.com's /ubl endpoint, once e-invoicing is needed.